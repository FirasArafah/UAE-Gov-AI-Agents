<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYNORA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
  <h1>SYNORA</h1>
  <p>تدقيق التحيّز في قرارات الذكاء الاصطناعي الحكومية: الفيزا والإقامة الذهبية</p>
</header>

<main>
    <input type="file" id="file" accept=".csv">
  <p id="fileInfo"></p>
  
  <button id="run">شغّل التدقيق</button>

  <h2>مراحل التدقيق</h2>
  <ol id="pipeline"></ol>

  <section id="results" hidden>
    <div id="verdict"></div>
    <h2>نسبة القبول لكل مجموعة</h2>
    <div id="bars"></div>
    <p class="note">الخط الأسود يمثل 80% من أعلى مجموعة. أي مجموعة تحته تُعتبر مشبوهة.</p>
    <h2>التقرير</h2>
    <p id="report"></p>
  </section>
</main>


  <script src="app.js"></script>
</body>
</html>
