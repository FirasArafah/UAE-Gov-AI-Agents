name: synora

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: synora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synora_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-synora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synora} -d ${POSTGRES_DB:-synora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [synora]

  ollama:
    image: ollama/ollama:latest
    container_name: synora-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [synora]

  ollama-init:
    image: ollama/ollama:latest
    container_name: synora-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "
        echo 'Pulling LLM...' &&
        ollama pull ${OLLAMA_LLM_MODEL:-qwen2.5:7b-instruct} &&
        echo 'Pulling embeddings...' &&
        ollama pull ${OLLAMA_EMBED_MODEL:-bge-m3} &&
        echo 'Models ready.'
      "
    restart: "no"
    networks: [synora]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synora}:${POSTGRES_PASSWORD:-synora_dev_password}@postgres:5432/${POSTGRES_DB:-synora}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    command: uvicorn synora.main:app --host 0.0.0.0 --port 8000 --reload
    networks: [synora]

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: synora-ui
    restart: unless-stopped
    depends_on: [backend]
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${UI_PORT:-5173}:5173"
    volumes:
      - ./ui:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    profiles: ["ui"]
    networks: [synora]

volumes:
  postgres_data:
  ollama_models:

networks:
  synora:
    driver: bridge