<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SYNORA: multi-agent AI governance simulation grounded in national policy and global best practice." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <title>SYNORA</title>
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="SYNORA home">
      <img src="/favicon.svg" alt="" width="28" height="28" />
      <span>SYNORA</span>
    </a>
    <nav id="nav" aria-label="Main">
      <a href="#/" data-nav="/">Overview</a>
      <a href="#/sessions" data-nav="/sessions">Simulations</a>
      <a href="#/chat" data-nav="/chat">Ask agents</a>
      <a href="#/kb" data-nav="/kb">Knowledge base</a>
      <a href="#/agents" data-nav="/agents">Agents</a>
    </nav>
    <div class="topbar-end">
      <span id="health" class="health" title="Checking system status">
        <i></i><span>Checking</span>
      </span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="footer">
    <span>SYNORA · ITU AI for Good Lab Hackathon — UAE</span>
    <span>Aligned with ITU-T Y.3172 and the ITU AI Readiness Framework · All inference runs locally</span>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
