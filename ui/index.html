<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mathuq: multi-agent AI governance assistant grounded in national policy and global best practice." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <title>Mathuq · موثوق</title>
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <a href="#/" class="brand" aria-label="Mathuq">
        <img class="logo logo-on-light" src="/logo-black.svg" alt="" width="30" height="30" />
        <img class="logo logo-on-dark" src="/logo-white.svg" alt="" width="30" height="30" />
        <span class="brand-name">Mathuq</span>
      </a>
      <a href="#/new" class="new-chat">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        <span>New chat</span>
      </a>
      <nav id="nav" aria-label="Main">
        <a href="#/" data-nav="/">Chat</a>
        <a href="#/agents" data-nav="/agents">Agents</a>
        <a href="#/kb" data-nav="/kb">Knowledge base</a>
      </nav>
      <section class="recents" aria-label="Recent chats">
        <h2>Recent</h2>
        <div id="recents"></div>
      </section>
      <div class="side-foot">
        <span id="health" class="health" title="Checking system status">
          <i></i><span>Checking</span>
        </span>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle colour theme">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.5 5.5 0 0 1 13.36 3.1 9.3 9.3 0 0 0 12 3z"/></svg>
        </button>
      </div>
    </aside>
    <main id="app"></main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
